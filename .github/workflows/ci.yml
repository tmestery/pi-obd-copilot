name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Type-check
        run: mypy
      - name: Test
        run: pytest tests/unit tests/integration --cov --cov-report=term-missing --cov-report=xml -m "not e2e and not hardware and not slow"
      - name: Coverage gate (core packages)
        run: python scripts/coverage_gate.py coverage.xml
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml
