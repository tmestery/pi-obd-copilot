[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "gti-copilot"
version = "0.0.0"
description = "Raspberry Pi 5 in-car computer for a MK7 VW Golf GTI: read-only OBD-II dashboard, radar/GPS fusion, dashcam perception and an offline SLM co-pilot."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Tyler Mestery" }]
keywords = ["obd", "obd-ii", "raspberry-pi", "dashboard", "golf-gti", "radar-detector", "dashcam", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Hardware",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "pyserial>=3.5",
  "httpx>=0.27",
]

[project.optional-dependencies]
radar = ["r8link>=0.9; sys_platform == 'linux'", "bleak>=0.21; sys_platform == 'linux'"]
camera = ["opencv-python-headless>=4.9", "numpy>=1.26"]
perception = ["onnxruntime>=1.17", "numpy>=1.26"]
copilot = ["llama-cpp-python>=0.2; sys_platform == 'linux'"]
voice = ["faster-whisper>=1.0", "piper-tts>=1.2; sys_platform == 'linux'"]
gps = ["gpsdclient>=1.3"]
pi = ["gpiozero>=2.0; sys_platform == 'linux'"]
images = ["matplotlib>=3.8", "playwright>=1.42", "numpy>=1.26"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "hypothesis>=6.98",
  "ruff>=0.4",
  "mypy>=1.9",
  "pre-commit>=3.6",
  "httpx>=0.27",
  "websockets>=12",
  "playwright>=1.42",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "types-PyYAML",
  "types-pyserial",
]

[project.scripts]
gti-copilot = "gti_copilot.cli:main"

[project.urls]
Homepage = "https://github.com/tmestery/pi-obd-copilot"
Issues = "https://github.com/tmestery/pi-obd-copilot/issues"
Changelog = "https://github.com/tmestery/pi-obd-copilot/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/gti_copilot"]

[tool.hatch.build.targets.sdist]
exclude = ["/src/gti_copilot/web/node_modules", "/.venv", "/docs/images/*.gif"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["src/gti_copilot/web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S", "N", "PL"]
ignore = [
  "S101",    # assert in tests is fine
  "S311",    # random is fine for simulation noise
  "PLR0913", # many arguments in dataclass-like constructors
  "PLR2004", # magic values in physics/decoding code
  "PLR0912", "PLR0915", "PLR0911", # complexity in simulators/state machines
  "RUF012",
  "S603", "S607", # subprocess calls with fixed argv (ffmpeg, systemctl)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PL", "B011", "ASYNC"]
"scripts/**" = ["S", "PL"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["gti_copilot"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["src/gti_copilot/web/"]

[[tool.mypy.overrides]]
module = [
  "gti_copilot.obd.*",
  "gti_copilot.storage.*",
  "gti_copilot.perf.*",
  "gti_copilot.copilot.grounding",
  "gti_copilot.copilot.policy",
  "gti_copilot.api.schemas",
  "gti_copilot.units",
  "gti_copilot.config",
]
strict = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -q --strict-markers"
markers = [
  "e2e: browser end-to-end tests (need Playwright + built web assets)",
  "slow: long-running soak or simulation tests",
  "hardware: requires real hardware (never run in CI)",
]
filterwarnings = ["error::DeprecationWarning:gti_copilot.*"]

[tool.coverage.run]
source = ["gti_copilot"]
branch = true
omit = [
  "src/gti_copilot/web/*",
  "src/gti_copilot/obd/elm_transport.py",
  "src/gti_copilot/gps/gpsd_provider.py",
  "src/gti_copilot/radar/r8link_provider.py",
  "src/gti_copilot/camera/pi_source.py",
  "src/gti_copilot/camera/v4l2_source.py",
  "src/gti_copilot/perception/hailo_stub.py",
  "src/gti_copilot/copilot/llama_backend.py",
  "src/gti_copilot/copilot/ollama_backend.py",
  "src/gti_copilot/copilot/stt.py",
  "src/gti_copilot/copilot/tts.py",
  "src/gti_copilot/power/shutdown.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
